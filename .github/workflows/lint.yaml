# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Fails when lintr finds any lint, with the rules in .lintr. The package is loaded first:
# without it the object-usage linter cannot see package functions or the .data pronoun
# and reports hundreds of false findings.
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The renv autoloader in .Rprofile must not take over the library on CI
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::pkgload, local::.
          needs: lint

      - name: Lint the package
        run: |
          pkgload::load_all()
          lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
